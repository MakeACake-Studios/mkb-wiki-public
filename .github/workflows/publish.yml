name: Publish wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'assets/**'

jobs:
  rebuild-site:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private site build
        env:
          GH_TOKEN: ${{ secrets.MKB_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MKB_SITE_DISPATCH_TOKEN is not configured; skipping the private build trigger"
            exit 0
          fi
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MakeACake-Studios/mkb-site/dispatches \
            --data '{"event_type":"wiki-content-updated"}'
