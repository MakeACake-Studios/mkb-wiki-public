name: Publish wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'assets/**'

jobs:
  rebuild-site:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger private site build
        env:
          GH_TOKEN: ${{ secrets.MKB_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MKB_SITE_DISPATCH_TOKEN is not configured"
            exit 1
          fi

          gh workflow run build.yml \
            --repo MakeACake-Studios/mkb-site \
            --ref main